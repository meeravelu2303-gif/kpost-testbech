name: CI

# Production-grade gate for the monorepo. It does NOT run the integration suites — those need a
# live KPost backend and are executed against a target environment on demand, not in CI. CI's job
# is to keep the code that DRIVES those suites healthy: install, type-check every suite, and lint.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Skip Playwright's browser download here — CI only type-checks/lints, it doesn't run browsers.
      - name: Install (workspaces)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type-check — KPost API
        run: npm run typecheck:api

      - name: Type-check — KMail
        run: npm run typecheck:kmail

      - name: Type-check — KPost Admin
        run: npm run typecheck:admin

      - name: Type-check — KPost UI
        run: npm run typecheck:ui

      - name: Lint — KPost UI
        run: npm run lint:ui

      # Every suite must still COLLECT. A type-clean spec can still fail to load (a bad import,
      # a duplicate project name, a config that throws), and that is invisible to tsc.
      - name: Collect — every suite
        run: npm run collect

      # The false-finding gate: refuses the build when an endpoint has lost a mandatory
      # security vector. Offline, so it belongs here rather than in the live run.
      - name: Vector gate — KPost API
        run: npm run audit:vectors -w kpost-api

      # The contract gate: the Excel workbook is authoritative for request payloads, and this
      # refuses the build when a mandatory endpoint stops sending a documented field. Pinned at
      # 100% — a new Excel row should fail on arrival rather than drift in unnoticed. Offline:
      # it reads the checked-in contract at suites/kpost-api/docs/excel/endpoints.json.
      - name: Excel payload-conformance gate — KPost API
        run: npm run audit:excel -w kpost-api

      # Offline unit tests for the bench's own reporting code (Bugzilla payloads, dedup).
      - name: Unit tests — reporter internals
        run: npm run test:unit -w kpost-api

      # Fails on a requirement tag that names nothing in docs/requirements.json — a silent
      # typo there makes a test look traced while counting toward nothing.
      - name: Requirement traceability
        run: npm run trace

      # NOTE: `npm run format:check` is deliberately NOT a gate. 367 pre-existing files predate
      # the root prettier config, and reformatting them under divergent per-suite settings would
      # churn every working file for no behavioural gain. Run `npm run format` on files you touch.
